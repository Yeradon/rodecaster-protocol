[package]
name = "rodecaster-protocol"
version = "0.14.0"
edition = "2021"
authors = ["Yeradon"]
description = "JUCE var / ValueTree codec and transport frame for the RODECaster Pro II / Duo wire protocol"
license = "MIT"
repository = "https://github.com/Yeradon/rodecaster-protocol"
readme = "README.md"
keywords = ["rodecaster", "rode", "juce", "valuetree", "protocol"]
